# Rigenera i dati GTFS e ridistribuisce l'app (Worker con asset statici) su Cloudflare.
# Ogni notte (l'indice orari copre ieri dopo mezzanotte, oggi e domani), a ogni push su main e a mano.
# Secrets: BUSONE_CONTACT, CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers"), CLOUDFLARE_ACCOUNT_ID.
name: Dati e deploy

on:
  schedule:
    - cron: '30 2 * * *'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/build-gtfs.ts
        env:
          BUSONE_CONTACT: ${{ secrets.BUSONE_CONTACT }}
      - run: npm run build -w app
      - run: npx wrangler deploy -c app/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
